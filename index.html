<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کانال آرین گیمر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- لود کردن فونت‌ها به روش مطمئن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
  /* فونت اصلی برای متن‌ها */
  font-family: 'Vazirmatn', Tahoma, sans-serif; 
  background-color: #050510; /* تاریک‌ترین حالت */
  color: #ffffff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

/* نورهای آبی نئونی متحرک در پس‌زمینه */
body::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: 
    radial-gradient(circle at 30% 70%, rgba(0, 212, 255, 0.2), transparent 45%),
    radial-gradient(circle at 70% 30%, rgba(37, 99, 235, 0.2), transparent 45%);
  animation: rotateBg 15s linear infinite;
  z-index: 0;
}

@keyframes rotateBg {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 30px 20px;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* آیکون با درخشش آبی */
.gamer-icon {
  font-size: 4em;
  margin-bottom: 20px;
  animation: floatIcon 3s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));
}

@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* متن با فونت گیمری و درخشش آبی */
.main-text {
  font-family: 'Lalezar', cursive; /* فونت خفن گیمری */
  font-size: 2.2em;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 40px;
  color: #ffffff;
  text-shadow: 
    0 0 10px rgba(0, 212, 255, 0.8),
    0 0 20px rgba(0, 212, 255, 0.5),
    0 0 40px rgba(0, 212, 255, 0.3);
  animation: pulseText 2s infinite alternate;
}

@keyframes pulseText {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(1.02); opacity: 1; }
}

/* دکمه آبی نئونی */
.notify-btn {
  background: rgba(0, 212, 255, 0.05);
  color: #00d4ff;
  border: 2px solid #00d4ff;
  padding: 15px 30px;
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  font-size: 1.1em;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 
    0 0 15px rgba(0, 212, 255, 0.4), 
    inset 0 0 10px rgba(0, 212, 255, 0.2);
}

.notify-btn:hover, .notify-btn:active {
  background: rgba(0, 212, 255, 0.2);
  color: #ffffff;
  box-shadow: 
    0 0 30px rgba(0, 212, 255, 0.8), 
    inset 0 0 20px rgba(0, 212, 255, 0.4);
  transform: scale(0.95);
}

/* پیام تایید */
.success-msg {
  display: none;
  background: rgba(34, 197, 94, 0.1);
  border: 2px solid #22c55e;
  color: #86efac;
  padding: 20px;
  border-radius: 15px;
  font-size: 1.1em;
  font-weight: 700;
  line-height: 1.6;
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-shadow: 0 0 5px rgba(34, 197, 94, 0.5);
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.8) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <div class="gamer-icon">🎮</div>
  <div class="main-text">به زودی اپلیکیشن راه اندازی می‌شود!</div>
  
  <button class="notify-btn" id="notifyBtn" onclick="notifyMe()">
    اگه راه اندازی شد، خبرم کن
  </button>

  <div class="success-msg" id="successMsg">
    ✅ تایید شد!<br>جواب شما در همین ربات اطلاع رسانی می‌شود.
  </div>
</div>

<script>
  // راه‌اندازی مینی اپ تلگرام
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  // سیستم صدا
  var audioCtx = null;
  function playClickSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(1000, t + 0.1);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      
      osc.start(t);
      osc.stop(t + 0.15);
    } catch(e) {}
  }

  // عملکرد دکمه
  function notifyMe() {
    playClickSound();
    
    var btn = document.getElementById('notifyBtn');
    var msg = document.getElementById('successMsg');
    
    btn.style.display = 'none';
    msg.style.display = 'block';
  }
</script>

</body>
</html>
